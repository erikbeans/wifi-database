name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: wifi
          POSTGRES_PASSWORD: wifi
          POSTGRES_DB: wifi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wifi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: server
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: server
        env:
          WIFI_DATABASE_URL: postgresql+psycopg2://wifi:wifi@localhost:5432/wifi_test
        run: pytest -v

  compose-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose -f server/docker-compose.yml up -d --build

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 2
          done
          echo "healthz never became reachable"
          docker compose -f server/docker-compose.yml logs api
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f server/docker-compose.yml down -v
