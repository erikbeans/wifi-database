name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start PostGIS (retries Docker Hub pulls)
        run: |
          started=0
          for i in $(seq 1 15); do
            if docker run -d --name postgis -p 5432:5432 \
                -e POSTGRES_USER=wifi -e POSTGRES_PASSWORD=wifi -e POSTGRES_DB=wifi_test \
                postgis/postgis:16-3.4 >/dev/null; then
              started=1
              break
            fi
            echo "docker run attempt $i failed; retrying in 20s"
            docker rm -f postgis 2>/dev/null || true
            sleep 20
          done
          test "$started" -eq 1
          for i in $(seq 1 60); do
            if docker exec postgis pg_isready -U wifi -d wifi_test >/dev/null 2>&1; then
              echo "PostGIS ready"
              exit 0
            fi
            sleep 2
          done
          echo "PostGIS never became ready"
          docker logs postgis
          exit 1

      - name: Install dependencies
        working-directory: server
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: server
        env:
          WIFI_DATABASE_URL: postgresql+psycopg2://wifi:wifi@localhost:5432/wifi_test
        run: pytest -v

  compose-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull and build the stack (retries Docker Hub pulls)
        run: |
          built=0
          for i in $(seq 1 15); do
            if docker compose -f server/docker-compose.yml pull --quiet && \
               docker compose -f server/docker-compose.yml build; then
              built=1
              break
            fi
            echo "attempt $i failed; retrying in 20s"
            sleep 20
          done
          test "$built" -eq 1

      - name: Start the stack
        run: docker compose -f server/docker-compose.yml up -d

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "healthz OK"
              exit 0
            fi
            sleep 2
          done
          echo "healthz never became reachable"
          docker compose -f server/docker-compose.yml logs api
          exit 1

      - name: Tear down
        if: always()
        run: docker compose -f server/docker-compose.yml down -v
