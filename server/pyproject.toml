[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wifi-database-server"
version = "0.1.0"
description = "Crowd-sourced WiFi access-point password directory — REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "slowapi>=0.1.9",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
